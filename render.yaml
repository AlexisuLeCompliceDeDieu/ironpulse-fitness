services:
  - type: web
    name: ironpulse-fitness
    runtime: docker
    plan: free
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER_ORDER
        value: "groq,gemini,mistral,openrouter"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: MISTRAL_MODEL
        value: "open-mistral-nemo"
      - key: OPENROUTER_MODEL
        value: "qwen/qwen-2.5-72b-instruct:free"
