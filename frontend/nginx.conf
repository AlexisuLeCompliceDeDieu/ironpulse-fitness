# Proxy les appels /api vers le backend Flask en production.
# IMPORTANT : remplacer l'URL ci-dessous par l'adresse réelle du backend
# (ex: https://monbackend.onrender.com) puis reconstruire l'image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://monbackend.onrender.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
